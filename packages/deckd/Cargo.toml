[package]
name = "deckd"
version = "0.1.0"
edition = "2021"
description = "Deck History daemon — historyd-compatible HTTP over jj-lib (copied from jj-historyd)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/christse/deck"
readme = "README.md"

[[bin]]
name = "deckd"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
# Only for `gix::hash::Kind` when initializing a repo; must match jj-lib's gix.
gix = { version = "0.88.0", default-features = false }
# From crates.io, not a fork of the jj git tree. 0.46 needs rustc 1.97.1.
jj-lib = "0.46.0"
notify = "7"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "fs", "io-util", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Derived esbuild AMD plane (`/ensure-build`, `/artifact-at`). Off by default —
# History is the product; enable with `cargo run --features build`.
build = []

[dev-dependencies]
ureq = { version = "2", default-features = false, features = ["json"] }
