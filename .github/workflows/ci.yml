name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test workspace packages
        env:
          DECKD_URL: http://127.0.0.1:1
        run: pnpm run --filter './packages/**' --if-present -r test

  deckd-build:
    name: Rust deckd build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Run cargo from packages/deckd so rustup picks up its rust-toolchain.toml.
      - name: Show Rust toolchain
        working-directory: packages/deckd
        run: rustc --version && cargo --version
      - name: Build deckd
        working-directory: packages/deckd
        run: cargo build --locked
      - name: Test deckd
        working-directory: packages/deckd
        run: cargo test --locked
      - name: Preserve deckd for collaboration replay
        uses: actions/upload-artifact@v4
        with:
          name: deckd-linux
          path: packages/deckd/target/debug/deckd
          if-no-files-found: error
          retention-days: 1

  collaboration:
    name: Collaboration replay
    needs: deckd-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: deckd-linux
          path: .ci/deckd
      - name: Replay collaboration through the built deckd
        env:
          DECKD_BIN: .ci/deckd/deckd
        run: |
          chmod +x "$DECKD_BIN"
          pnpm test:collaboration
