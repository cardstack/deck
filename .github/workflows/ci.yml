name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test workspace packages
        env:
          DECKD_URL: http://127.0.0.1:1
        run: pnpm run --filter './packages/**' --if-present -r test

  deckd-build:
    name: Rust deckd build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Build deckd
        run: cargo build --locked --manifest-path packages/deckd/Cargo.toml

  collaboration:
    name: Collaboration replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:collaboration
