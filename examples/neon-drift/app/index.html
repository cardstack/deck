<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Drift Lab — Deck vibe demo</title>
    <script type="module" src="/_live/hmr.js"></script>
    <script type="importmap">
      {
        "imports": {
          "simplex-noise": "/@simplex-noise@4.0.1",
          "ink": "/live/ink/ink.js",
          "ink/themes": "/live/ink/themes.js",
          "swarm": "/live/swarm/swarm.js",
          "fireworks": "/live/fireworks/fireworks.js",
          "water": "/live/water/water.js"
        }
      }
    </script>
    <style>
      :root {
        --ink: #e8f0ff;
        --muted: #8aa0c0;
        --panel: rgba(8, 12, 24, 0.78);
        --line: rgba(120, 160, 220, 0.28);
        --accent: #3dffc0;
        --font: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        --display: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        --bg: #050814;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 600px at 10% -10%, #12204a 0%, transparent 55%),
          radial-gradient(900px 500px at 90% 0%, #1a1030 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: var(--font);
      }
      header {
        padding: 1.1rem 1.25rem 0.4rem;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.6rem 1rem;
      }
      header h1 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.55rem;
        font-weight: 600;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .pill {
        display: inline-block;
        padding: 0.12rem 0.45rem;
        border: 1px solid var(--line);
        color: var(--accent);
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.85rem;
        padding: 0.85rem 1.25rem 1.25rem;
        min-height: calc(100vh - 4.5rem);
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; min-height: auto; }
        .block { min-height: 52vh; }
      }
      .block {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: 1px solid var(--line);
        background: rgba(4, 8, 18, 0.55);
        overflow: hidden;
      }
      .block header.block-head {
        position: absolute;
        z-index: 2;
        left: 0.75rem;
        top: 0.7rem;
        right: 0.75rem;
        padding: 0;
        pointer-events: none;
      }
      .block h2 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.15rem;
        font-weight: 600;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }
      .block .hint {
        margin: 0.15rem 0 0;
        color: var(--muted);
        font-size: 0.75rem;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      .block .hint kbd {
        font: inherit;
        color: var(--accent);
      }
      .block canvas {
        display: block;
        width: 100%;
        flex: 1;
        min-height: 280px;
        cursor: crosshair;
        touch-action: none;
      }
      .pkg {
        position: absolute;
        z-index: 2;
        left: 0.75rem;
        bottom: 0.65rem;
        font-size: 0.68rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }
      .pkg strong { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <span class="pill">Deck live</span>
      <h1>Neon Drift Lab</h1>
      <p>Three packages · one import map · HMR on save</p>
    </header>
    <main class="grid">
      <section class="block" data-panel="drift">
        <header class="block-head">
          <h2>Drift</h2>
          <p class="hint">Click to birth a vortex · <kbd>/live/swarm</kbd></p>
        </header>
        <canvas id="drift"></canvas>
        <div class="pkg"><strong>swarm</strong> + ink + simplex-noise</div>
      </section>
      <section class="block" data-panel="fireworks">
        <header class="block-head">
          <h2>Fireworks</h2>
          <p class="hint">Click to launch · <kbd>/live/fireworks</kbd></p>
        </header>
        <canvas id="fireworks"></canvas>
        <div class="pkg"><strong>fireworks</strong> + ink + simplex-noise</div>
      </section>
      <section class="block" data-panel="water">
        <header class="block-head">
          <h2>Water</h2>
          <p class="hint">Click ripples · <kbd>/live/water</kbd></p>
        </header>
        <canvas id="water"></canvas>
        <div class="pkg"><strong>water</strong> + ink + simplex-noise</div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
